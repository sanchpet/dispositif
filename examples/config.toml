# dispositif example config. Every id, name and path below is a placeholder:
# replace them with your own. Check the result with
#   dispositif check --config /path/to/config.toml

# mcp-tg daemon logged in as the agent's Telegram account (streamable HTTP).
mcp_url = "http://127.0.0.1:8788"
interval_secs = 10

# The agent's own Telegram account: its messages never trigger a run, and
# "@example_agent" in a message counts as a mention.
agent_id = 1000001
agent_username = "example_agent"

# claude binary: a path, or a name looked up on PATH.
claude_bin = "claude"
# Extra environment for every run; a leading ~ is expanded.
claude_env = { CLAUDE_CONFIG_DIR = "~/.claude" }

# A chat's claude session is resumed until it is this old, then a fresh one starts.
session_ttl_secs = 86400
# A run that takes longer is killed and answered with fallback_reply.
run_timeout_secs = 900
# Recent messages of the chat given to the run as context.
history = 15

# Prepended to every run's prompt. The run's final message is posted verbatim.
preamble = """
You are an assistant answering in Telegram from your own account. No one is
watching this run live. Your final message is posted verbatim as your reply in
the chat below, so it must be the reply itself: plain text, short like a chat
message, in the language the person wrote in, no report about what you did.
"""

# Posted when a run fails or times out.
fallback_reply = "Could not process this message; the owner will see it in the logs."

# Rules are tried in order; the first that admits a message decides its tier.
# peer:      dialog id as mcp-tg prints it (user id, -chat id, -100... channel id), or "*"
# from:      sender ids this rule admits: bare user ids, or bare channel ids with
#            sender = "channel"
# sender:    "user" (default) or "channel": a channel's posts in its discussion group.
#            The two share one id space, so a rule never admits the other kind
# trigger:   "any" = every message; "mention_or_reply" = only a mention of the agent
#            or a reply to one of its messages (always satisfied in a direct message)
# min_chars: messages shorter than this are not admitted (default 0)
# trust:     name of the [tier.*] that runs the message

# The owner, in a direct message with the agent.
[[rule]]
name = "owner-dm"
peer = "1000002"
from = [1000002]
trigger = "any"
trust = "full"

# A partner and the owner in one shared group, when addressing the agent.
# Listed before the owner's "*" rule on purpose: a run sees the group's recent
# messages, so in a chat the partner writes to even the owner gets the partner
# tier, and text the partner planted there never reaches a full-tier run.
[[rule]]
name = "partner"
peer = "-1000003"
from = [1000002, 1000004]
trigger = "mention_or_reply"
trust = "partner"

# The owner, in any other chat, when addressing the agent.
[[rule]]
name = "owner-mention"
peer = "*"
from = [1000002]
trigger = "mention_or_reply"
trust = "full"

# The owner's channel, through its discussion group: every post long enough to
# say something gets a public comment and a private note to the owner. A long post
# split into several messages is answered once, on its last part.
[[rule]]
name = "channel"
peer = "-1000006"
from = [1000007]
sender = "channel"
trigger = "any"
min_chars = 200
trust = "channel"

# Tiers map trust to capabilities.
# cwd:             working directory of the run
# permission_mode: passed as --permission-mode when set
# restricted:      --restricted --strict-mcp-config --tools <tools>: no shell,
#                  no MCP servers, no files outside cwd
# tools:           restricted tiers only; read-only tools, comma-separated:
#                  Read, Grep, Glob, WebFetch, WebSearch
# dm_peer:         split the answer: the run ends with {"comment": ..., "dm": ...};
#                  the comment is the public reply, dm goes privately to this peer.
#                  A failed or unparsed run reaches dm_peer only
# resume:          resume the chat's previous claude session (default true); turn it
#                  off when runs read their memory from the chat and resuming only
#                  adds cost
# instructions:    added to the prompt after the preamble

[tier.full]
cwd = "~/notes"
permission_mode = "auto"
restricted = false
instructions = """
The message is from the owner. Treat it as an instruction typed into a session.
"""

[tier.partner]
cwd = "/path/to/repo"
restricted = true
tools = "Read,Grep,Glob,WebFetch,WebSearch"
instructions = """
The message is from a project partner. You may read the repository in the
working directory and public web pages. Change nothing, promise nothing, commit
to no dates: anything that changes code, deploys or spends money goes to the
owner; say so. Say nothing about the owner personally.
"""

[tier.channel]
cwd = "~/notes"
permission_mode = "auto"
dm_peer = "1000002"
resume = false
instructions = """
The message is a post from the owner's own channel. Comment on it for the
channel's readers, and tell the owner privately what it changes in his notes.
"""
